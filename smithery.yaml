# Smithery (smithery.ai): cómo arrancar este servidor MCP por stdio.
#
# Retirado el 2026-09-07. Arranca y contesta el aviso de retirada: `tools/list`
# devuelve una lista vacía y cualquier `tools/call` devuelve qué había, desde
# cuándo no está y por qué. No hay sustituto: https://enchantedcolony.com/api/
#
# Sin configuración: `EC_API_KEY` ya no se lee, porque no queda a quién
# llamar con una clave.
startCommand:
  type: stdio
  configSchema:
    type: object
    properties: {}
    required: []
  commandFunction: |-
    () => ({
      command: "npx",
      args: ["-y", "enchantedcolony-mcp"]
    })
